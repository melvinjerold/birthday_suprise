<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 💖</title>

<style>
body{
margin:0;
font-family:Segoe UI;
overflow:hidden;
background:black;
color:white;
}

#text p {
    margin-bottom: 15px;
    line-height: 1.6;
}

/* ---------------- LOCK ---------------- */
.lock{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
position:relative;
}

.lock::before{
content:"";
position:absolute;
inset:0;
background:url("img10.jpeg") center/cover no-repeat;
filter:blur(8px) brightness(0.5);
animation:water 8s infinite alternate ease-in-out;
}

@keyframes water{
0%{transform:scale(1.05);}
50%{transform:scale(1.1) translate(-10px,10px);}
100%{transform:scale(1.15) translate(10px,-10px);}
}


@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-5px);}
50%{transform:translateX(5px);}
75%{transform:translateX(-5px);}
100%{transform:translateX(0);}
}

.lockBox{
position:relative;
z-index:2;
text-align:center;
}

.title{font-size:24px;font-weight:bold;margin-bottom:10px;}

.dots{
display:flex;
gap:10px;
justify-content:center;
margin-bottom:20px;
}

.dot{
width:14px;
height:14px;
border-radius:50%;
border:2px solid white;
}

.filled{background:white;transform:scale(1.2);}

.keypad{
display:grid;
grid-template-columns:repeat(3,70px);
gap:10px;
justify-content:center;
}

.key{
width:65px;
height:65px;
border-radius:50%;
background:rgba(255,255,255,0.15);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}



/* ---------------- CAKE PAGE ---------------- */


.mainTitle{
position:absolute;
top:40px;
font-size:28px;
font-weight:bold;
color:#d63384;
text-shadow:0 2px 10px rgba(255,255,255,0.6);
z-index:2;
}

.cakeInnerText{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:14px;
font-weight:bold;
color:white;
text-align:center;
text-shadow:0 2px 5px rgba(0,0,0,0.3);
pointer-events:none;
}


.cakePage{
display:none;
height:100vh;
width:100%;
background:linear-gradient(135deg,#cfe8ff,#e6f2ff,#d6f0ff);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

position:relative;
overflow:hidden;
}
/* 🎂 CAKE CONTAINER */
.cake{
position:relative;
width:220px;
height:160px; /* ✅ important */
z-index:2; 
}

/* Common layer fix */
.layer{
position:absolute;
left:50%;
transform:translateX(-50%);
}

/* 🍰 BOTTOM LAYER */
.bottom{
width:220px;
height:90px;
background:linear-gradient(to bottom,#ff6f91,#ff4b7d);
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
bottom:0; /* ✅ stick to bottom */
}

/* 🍰 TOP LAYER */
.top{
width:160px;
height:70px;
background:linear-gradient(to bottom,#ff9bb3,#ff6f91);
border-radius:20px;
top:20px; /* ✅ properly placed */
box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

/* 🍦 CREAM TOP */
.top::before,
.bottom::before{
content:"";
position:absolute;
top:-10px;
left:0;
width:100%;
height:20px;
background:#fff0f5;
border-radius:50%;
}

/* 🍦 DRIPS */
.drips{
position:absolute;
top:15px; /* ✅ aligned with top layer */
left:50%;
transform:translateX(-50%);
width:160px;
display:flex;
justify-content:space-between;
}

.drips span{
width:14px;
background:#fff0f5;
border-radius:0 0 10px 10px;
animation:drip 2s infinite ease-in-out;
}

.drips span:nth-child(1){height:20px;}
.drips span:nth-child(2){height:30px;}
.drips span:nth-child(3){height:18px;}
.drips span:nth-child(4){height:25px;}
.drips span:nth-child(5){height:15px;}

@keyframes drip{
0%{transform:scaleY(1);}
50%{transform:scaleY(1.2);}
100%{transform:scaleY(1);}
}

/* 🕯️ CANDLES */
.candles{
position:absolute;
top:-25px; /* ✅ visible now */
left:50%;
transform:translateX(-50%);
display:flex;
gap:18px;
}

.candle{
width:10px;
height:45px;
background:linear-gradient(to bottom,#ffffff,#ffe6f0);
border-radius:3px;
position:relative;
}

/* wick */
.candle::before{
content:"";
position:absolute;
top:-6px;
left:50%;
transform:translateX(-50%);
width:2px;
height:6px;
background:black;
}

/* 🔥 FLAME */
.flame{
width:12px;
height:18px;
background:radial-gradient(circle, yellow 40%, orange 70%, transparent 80%);
border-radius:50%;
position:absolute;
top:-18px;
left:-1px;
animation:flicker 0.2s infinite alternate;
}

@keyframes flicker{
0%{transform:scale(1);}
100%{transform:scale(1.2);}
}

/* ✨ TEXT ON CAKE */
.cakeText{
position:absolute;
top:-55px; /* ✅ above candles */
width:100%;
text-align:center;
font-size:14px;
font-weight:bold;
color:white;
z-index:5;
}

/* 💫 MAKE A WISH */
.wishText{
font-size:22px;
font-weight:bold;
color:#d63384;
animation:fadeGlow 2s infinite alternate;
}

@keyframes fadeGlow{
from{opacity:0.6;}
to{opacity:1;}
}

/* 🌑 SHADOW */
.cake::after{
content:"";
position:absolute;
bottom:-10px;
left:50%;
transform:translateX(-50%);
width:180px;
height:15px;
background:rgba(0,0,0,0.2);
border-radius:50%;
filter:blur(5px);
}

#confetti{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:0; /* ✅ send to back */
}


#blowBtn{
padding:14px 30px;
border:none;
border-radius:30px;
background:linear-gradient(145deg,#ff4b7d,#ff85a2);
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer;

box-shadow:
0 5px 15px rgba(0,0,0,0.2),
inset 0 -3px 5px rgba(0,0,0,0.2),
inset 0 3px 5px rgba(255,255,255,0.3);

transition:all 0.2s ease;
}

/* hover glow */
#blowBtn:hover{
box-shadow:
0 0 15px #ff4b7d,
0 5px 20px rgba(0,0,0,0.3);
transform:translateY(-2px);
}

/* click press effect */
#blowBtn:active{
transform:translateY(2px);
box-shadow:
inset 0 3px 5px rgba(0,0,0,0.3);
}

#blowBtn{
animation:glowPulse 2s infinite alternate;
}

@keyframes glowPulse{
from{box-shadow:0 0 10px #ff85a2;}
to{box-shadow:0 0 25px #ff4b7d;}
}



/* 🎂 CAKE ALWAYS CENTER (IMPORTANT FIX) */


/* 🎈 BALLOONS */
.balloons{
position:absolute;
bottom:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
z-index:1;
}

.balloon{
position:absolute;
bottom:-120px;
width:50px;
height:65px;
border-radius:50%;
background:radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,0.2) 30%, transparent 60%),
linear-gradient(145deg,#ff4b7d,#ff85a2);
box-shadow:inset -5px -10px 20px rgba(0,0,0,0.2);
animation:floatUp linear forwards;
}

/* balloon string */
.balloon::after{
content:"";
position:absolute;
top:65px;
left:50%;
width:2px;
height:40px;
background:white;
transform:translateX(-50%);
opacity:0.8;
}

/* 🎈 FLOAT UP ANIMATION */
@keyframes floatUp{
0%{
transform:translateY(0) translateX(0);
opacity:0;
}
10%{opacity:1;}
100%{
transform:translateY(-120vh) translateX(var(--drift));
opacity:0;
}
}



/* 📸 MEMORY WRAPPER */
.memory{
position:absolute;
width:100%;
height:100%;
pointer-events:none;
z-index:1;
}

/* ENVELOPES */
.envelope{
width:140px;
height:90px;
position:absolute;
top:45%;
transform:translateY(-50%) scale(0);
transition:0.6s ease;
cursor:pointer;
perspective:1000px;
}

/* body of envelope */
.envelope::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:linear-gradient(145deg,#ff4b7d,#ff7aa2);
clip-path:polygon(0 100%,50% 55%,100% 100%,100% 0,0 0);
border-radius:6px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* flap */
.flap{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(145deg,#ff9bb3,#ff4b7d);
clip-path:polygon(0 0,100% 0,50% 55%);
transform-origin:top;
transition:0.8s ease;
z-index:3;
}

/* open animation */
.envelope.open .flap{
transform:rotateX(-160deg);
}

/* show envelope */
.envelope.show{
transform:translateY(-50%) scale(1);
}

/* envelope shadow */
.envelope::after{
content:"";
position:absolute;
bottom:-10px;
left:50%;
transform:translateX(-50%);
width:80%;
height:12px;
background:rgba(0,0,0,0.2);
filter:blur(6px);
border-radius:50%;
}


/* POSTAL CARDS */
.postal{
position:absolute;
width:160px;
height:190px;
background:white;
border-radius:10px;
box-shadow:0 15px 35px rgba(0,0,0,0.4);
padding:8px;
opacity:0;
overflow:hidden;

/* start ABOVE screen */
transform:translateY(-200px) scale(0.6) rotate(-10deg);
transition:1s ease;
}

.postal img{
width:100%;
height:140px;
object-fit:cover;
border-radius:8px;
transition:transform 3s ease;
}

.caption{
font-size:12px;
text-align:center;
margin-top:6px;
color:#d63384;
font-weight:bold;
}



#giftBtn{
padding:14px 32px;
border:none;
border-radius:40px;
background:linear-gradient(145deg,#ff4b7d,#ff85a2);
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer;
display:none;
margin-top:20px;

/* 3D premium look */
box-shadow:
0 8px 0 #c2185b,
0 15px 25px rgba(0,0,0,0.25);

transition:all 0.2s ease;
position:relative;
}

/* hover lift */
#giftBtn:hover{
transform:translateY(-3px);
box-shadow:
0 10px 0 #c2185b,
0 18px 30px rgba(0,0,0,0.3);
}

/* press effect */
#giftBtn:active{
transform:translateY(6px);
box-shadow:
0 2px 0 #c2185b,
0 5px 15px rgba(0,0,0,0.2);
}

/* subtle glow */
#giftBtn{
animation:giftGlow 2s infinite alternate;
}

@keyframes giftGlow{
from{box-shadow:0 8px 0 #c2185b,0 0 10px #ff4b7d;}
to{box-shadow:0 8px 0 #c2185b,0 0 25px #ff85a2;}
}

/* FINAL STATE */
.postal.show{
opacity:1;
transform:translateY(0) scale(1);
}

.postal.show img{
transform:scale(1.15);
}




.caption{
font-size:11px;
text-align:center;
margin-top:5px;
color:#d63384;
font-weight:bold;
}

/* positions */
.leftPostal{
left:25%;
top:50%;
transform:translate(-50%,-50%) scale(0.5);
}

.rightPostal{
right:25%;
top:50%;
transform:translate(50%,-50%) scale(0.5);
}

/* fly */
.flyLeft{
transform:translate(-160px,-100px) rotate(-10deg) scale(1);
opacity:1;
}

.flyRight{
transform:translate(160px,-100px) rotate(10deg) scale(1);
opacity:1;
}

/* CONFETTI */
#confetti{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:0;
}



/* ---------------- SURPRISE ---------------- */
.surprise{
display:none;
height:100vh;
position:relative;
}

.grid{
position:absolute;
width:100%;
height:100%;
display:grid;
grid-template-columns:repeat(5,1fr);
grid-auto-rows:100px;
}

.grid img{
width:100%;
height:100%;
object-fit:cover;
opacity:0.6;
}

#btn{
position:absolute;
padding:12px 20px;
border-radius:25px;
border:none;
background:white;
color:#ff4b7d;
font-weight:bold;
cursor:pointer;
transition:all 0.3s ease;
}

/* HEART */
#btn.heart{
width:80px;
height:80px;
background:#ff4b7d;
transform:rotate(-45deg);
border-radius:0;
animation:pulse 1s infinite;
padding:0;
}

#btn.heart::before,
#btn.heart::after{
content:"";
position:absolute;
width:80px;
height:80px;
background:#ff4b7d;
border-radius:50%;
}

#btn.heart::before{top:-40px;left:0;}
#btn.heart::after{left:40px;top:0;}

@keyframes pulse{
0%{transform:rotate(-45deg) scale(1);}
50%{transform:rotate(-45deg) scale(1.1);}
100%{transform:rotate(-45deg) scale(1);}
}

/* ---------------- FINAL PAGE ---------------- */
.final{
display:none;
height:100vh;
width:100%;
position:relative;
overflow:hidden;
}

.bg{
position:absolute;
width:100%;
height:100%;
z-index:0;
}

.bg img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
filter:blur(6px) brightness(0.4);
transition:opacity 1s ease-in-out;
}

.bg img.active{opacity:1;}

.left{
position:absolute;
left:0;
top:0;
width:60%;
height:100%;
z-index:2;
}

.left img{
position:absolute;
width:100%;
height:100%;
object-fit:contain;
opacity:0;
transition:opacity 2s ease-in-out;
}

.left img.show{opacity:0.95;}

.right{
position:absolute;
right:0;
top:0;
width:40%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
z-index:3;
}

.glass{
background:rgba(255,255,255,0.2);
backdrop-filter:blur(15px);
padding:25px;
border-radius:20px;
width:80%;
text-align:center;
 max-height: 80vh;     /* limit height */
    overflow-y: auto;     /* enable vertical scroll */
    padding-right: 10px;  /* avoid scrollbar overlap */
}

.cursor{
display:inline-block;
width:2px;
background:white;
animation:blink 1s infinite;
}

@keyframes blink{50%{opacity:0;}}



.farewell{
display:none;
height:100vh;
width:100%;
background:linear-gradient(135deg,#ffdde1,#ee9ca7);
justify-content:center;
align-items:center;
text-align:center;
color:#fff;
}

.farewellBox{
background:rgba(255,255,255,0.2);
backdrop-filter:blur(10px);
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
animation:fadeIn 2s ease;
}

.farewell h1{
font-size:32px;
margin-bottom:20px;
}

.farewell p{
font-size:18px;
line-height:1.6;
}

#endBtn{
margin-top:20px;
padding:14px 30px;
border:none;
border-radius:30px;
background:#ff4b7d;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
display:none;
animation:pulseBtn 1.5s infinite;
}

@keyframes pulseBtn{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}


/* 💖 FLOATING HEARTS */
.hearts{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
top:0;
left:0;
z-index:0;
}

.hearts span{
position:absolute;
bottom:-50px;
font-size:20px;
animation:floatUp 8s linear infinite;
opacity:0.8;
}

/* random positions */
.hearts span:nth-child(1){left:10%; animation-duration:6s;}
.hearts span:nth-child(2){left:20%; animation-duration:8s;}
.hearts span:nth-child(3){left:30%; animation-duration:7s;}
.hearts span:nth-child(4){left:40%; animation-duration:9s;}
.hearts span:nth-child(5){left:50%; animation-duration:6s;}
.hearts span:nth-child(6){left:60%; animation-duration:8s;}
.hearts span:nth-child(7){left:70%; animation-duration:7s;}
.hearts span:nth-child(8){left:80%; animation-duration:9s;}
.hearts span:nth-child(9){left:90%; animation-duration:6s;}

@keyframes floatUp{
0%{
transform:translateY(0) scale(0.8);
opacity:0;
}
20%{opacity:1;}
100%{
transform:translateY(-110vh) scale(1.3);
opacity:0;
}
}

/* ✍️ HANDWRITTEN STYLE */
.farewellBox{
position:relative;
z-index:2;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(10px);
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

#farewellText{
font-family:'Great Vibes', cursive;
font-size:26px;
line-height:1.8;
white-space:pre-line;
}



/* 🌌 NIGHT SKY CANVAS */
#starsCanvas{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
background:radial-gradient(circle at top,#0b1a2a,#000);
}

/* ensure content above stars */
.farewellBox{
position:relative;
z-index:2;
}

/* 💌 GLOWING TEXT */
#finalLove{
margin-top:25px;
font-size:32px;
font-weight:bold;
color:#ff4b7d;
opacity:0;
transform:scale(0.8);
text-align:center;

/* glow */
text-shadow:
0 0 10px #ff4b7d,
0 0 20px #ff4b7d,
0 0 40px #ff85a2,
0 0 60px #ff85a2;

transition:all 1.5s ease;
}

/* visible state */
#finalLove.show{
opacity:1;
transform:scale(1.2);
animation:lovePulse 2s infinite;
}

@keyframes lovePulse{
0%{transform:scale(1.1);}
50%{transform:scale(1.25);}
100%{transform:scale(1.1);}
}



</style>
</head>

let code = "";

/* ---------------- MUSIC ---------------- */
function startMusic() {
    if (!musicStarted) {
        song1.play().catch(() => {});
        musicStarted = true;
    }
}

/* ---------------- LOCK ---------------- */


document.addEventListener("keydown", function(e){

    startMusic(); // start music on first key press

    // numbers (0–9)
    if(e.key >= "0" && e.key <= "9"){
        press(e.key);
    }

    // backspace → delete last digit
    if(e.key === "Backspace"){
        code = code.slice(0, -1);
        updateDots();
    }

    // enter → validate manually
    if(e.key === "Enter"){
        if(code.length === 4){
            if(code === "0205"){
                startCake();
            }else{
                showError();
            }
        }
    }

});


function press(n) {
    startMusic();

    if (code.length < 4) {
        code += n;
        updateDots();

        if (code.length === 4) {
            if (code === "0205") {
                startCake();
            } else {
                showError();
            }
        }
    }
}

function clearCode() {
    code = "";
    updateDots();
}

function updateDots() {
    document.querySelectorAll(".dot").forEach((d, i) => {
        d.classList.toggle("filled", i < code.length);
    });
}

function showError() {
    document.getElementById("errorMsg").innerText = "Wrong code 😜 Try again!";
    code = "";
    updateDots();
}

/* ---------------- CAKE ---------------- */
function startCake() {

/* ---------------- CONFETTI ---------------- */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let confetti = [];

function startConfetti() {
    confetti = [];
    for (let i = 0; i < 150; i++) {
        confetti.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 5 + 2,
            d: Math.random() * 3 + 2
        });
    }

    setInterval(drawConfetti, 20);
}

function drawConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    confetti.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${Math.random() * 360},100%,60%)`;
        ctx.fill();

        c.y += c.d;
        if (c.y > canvas.height) c.y = 0;
    });
}

/* ---------------- BLOW CANDLES ---------------- */
blowBtn.addEventListener("click", function () {

/* 🎈 BALLOON GENERATOR */
function createBalloon() {

    balloon.style.left = Math.random() * 100 + "%";

    let size = Math.random() * 20 + 40;
    balloon.style.width = size + "px";
    balloon.style.height = size * 1.2 + "px";

    // random color
    const colors = [
        "#ff4b7d","#ff85a2","#ffd166","#06d6a0","#4cc9f0","#b388ff"
    ];
    let color = colors[Math.floor(Math.random() * colors.length)];
    balloon.style.background = color;

    // random animation duration
    balloon.style.animationDuration = (Math.random() * 5 + 5) + "s";

    // random side drift
    balloon.style.setProperty("--drift", (Math.random() * 200 - 100) + "px");

    container.appendChild(balloon);

    // remove after animation
    setTimeout(() => {
        balloon.remove();
    }, 10000);
}

}

function stopBalloons(){

}



function startBalloons(){

function startStars(){

const canvas = document.getElementById("starsCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];

for(let i=0;i<120;i++){
    stars.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*1.5,
        d: Math.random()*0.5
    });
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="white";

    stars.forEach(s=>{
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();

        s.y += s.d;

        if(s.y > canvas.height){
            s.y = 0;
            s.x = Math.random()*canvas.width;
        }
    });

    requestAnimationFrame(draw);
}
